<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Vault — security is the product (standalone demo)</title>
<style>
  :root{
    --bg:#0b0f1a;--panel:#131a2b;--panel-2:#1b2436;--ink:#e8edf6;--muted:#8a97b1;
    --accent:#3d7eff;--gold:#d9a441;--danger:#e2493b;--ok:#2faa6a;--line:#26314a;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink)}
  .topbar{display:flex;justify-content:space-between;align-items:center;padding:16px 28px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,#0e1422,#0b0f1a);flex-wrap:wrap;gap:12px}
  .brand{display:flex;flex-direction:column}
  .logo{font-weight:800;letter-spacing:2px;font-size:20px}
  .tagline{color:var(--muted);font-size:12px}
  .who{display:flex;flex-direction:column;align-items:center}
  .who .cust{font-weight:700}.who .tier{color:var(--muted);font-size:12px}
  .scenarios{display:flex;gap:8px;flex-wrap:wrap}
  .reset{background:var(--gold);color:#1a1300;border:none;padding:10px 16px;border-radius:8px;font-weight:700;cursor:pointer}
  .ghostbtn{background:transparent;color:var(--muted);border:1px solid var(--line);padding:10px 14px;border-radius:8px;font-weight:600;cursor:pointer}
  .grid{display:grid;grid-template-columns:1.4fr 1fr;gap:20px;padding:24px 28px;max-width:1200px;margin:0 auto}
  @media(max-width:900px){.grid{grid-template-columns:1fr}}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px}
  .panel h2{font-size:15px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin:18px 0 10px}
  .panel h2:first-child{margin-top:0}
  .accounts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .account{background:var(--panel-2);border:1px solid var(--line);border-radius:12px;padding:14px}
  .account.savings{border-left:3px solid var(--gold)}
  .account.current{border-left:3px solid var(--accent)}
  .account.joint{border-left:3px solid #7a5cff}
  .acc-name{font-weight:700}.acc-meta{color:var(--muted);font-size:12px;margin:4px 0 10px}
  .acc-balance{font-size:22px;font-weight:800}
  .form{display:grid;gap:12px}
  .form label{display:grid;gap:6px;font-size:13px;color:var(--muted)}
  .form input,.form select{background:var(--panel-2);border:1px solid var(--line);color:var(--ink);padding:10px 12px;border-radius:8px;font-size:15px}
  .form .check{display:flex;flex-direction:row;align-items:center;gap:8px}
  .primary{background:var(--accent);color:#fff;border:none;padding:12px;border-radius:8px;font-weight:700;font-size:15px;cursor:pointer}
  .primary:disabled{opacity:.5;cursor:not-allowed}
  .audit{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;max-height:78vh;overflow:auto}
  .audit-head{display:flex;justify-content:space-between;align-items:center}
  .audit-head h3{margin:0;font-size:15px}
  .integrity{font-size:12px;padding:4px 8px;border-radius:20px}
  .integrity.ok{background:rgba(47,170,106,.15);color:var(--ok)}
  .integrity.bad{background:rgba(226,73,59,.15);color:var(--danger)}
  .audit ol{list-style:none;padding:0;margin:14px 0 0}
  .audit li{padding:10px 0;border-bottom:1px solid var(--line)}
  .audit .row{display:flex;justify-content:space-between;gap:10px}
  .audit .actor{color:var(--muted);font-size:13px}
  .audit .action{font-weight:600;font-size:13px}
  .audit .hash{color:#5e6c8c;font-size:11px}
  .overlay{position:fixed;inset:0;background:rgba(4,7,14,.7);backdrop-filter:blur(4px);display:grid;place-items:center;z-index:50;padding:20px}
  .intervention{width:min(560px,100%);background:var(--panel);border:1px solid var(--line);border-top:4px solid var(--gold);border-radius:16px;padding:24px;box-shadow:0 30px 80px rgba(0,0,0,.6)}
  .intervention.held{border-top-color:var(--danger)}
  .intervention header{display:flex;gap:14px;align-items:flex-start}
  .intervention .shield{font-size:30px}
  .intervention h2{margin:0;font-size:19px}
  .intervention .sub{color:var(--muted);font-size:13px;margin:6px 0 0}
  .why{margin:16px 0;font-size:13px;color:var(--muted)}
  .why summary{cursor:pointer}.why ul{margin:8px 0 0;padding-left:18px}
  .qtext{font-size:16px;font-weight:600;margin:8px 0 14px}
  .options{display:grid;gap:10px}
  .options button,.freetext button{text-align:left;background:var(--panel-2);border:1px solid var(--line);color:var(--ink);padding:12px 14px;border-radius:10px;cursor:pointer;font-size:14px}
  .options button:hover{border-color:var(--accent)}
  .freetext{display:grid;gap:10px}
  .freetext textarea{background:var(--panel-2);border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:12px;font-size:14px;resize:vertical}
  .freetext button{text-align:center;background:var(--accent);border:none;color:#fff;font-weight:700}
  .decision h3{margin:0 0 8px}
  .decision .rationale{font-size:12px;color:var(--muted);background:var(--panel-2);padding:10px;border-radius:8px}
  .decision .actions{display:grid;gap:10px;margin:14px 0 8px}
  .decision .danger{background:var(--danger);color:#fff;border:none;padding:12px;border-radius:10px;font-weight:700;cursor:pointer}
  .decision .ghost{background:transparent;border:1px solid var(--line);color:var(--muted);padding:10px;border-radius:10px;cursor:pointer}
  .decision .agency{font-size:12px;color:var(--gold);text-align:center}
  .scoremeter{margin-top:18px;display:flex;align-items:center;gap:12px;font-size:12px;color:var(--muted)}
  .scoremeter .bar{flex:1;height:8px;background:var(--panel-2);border-radius:6px;overflow:hidden}
  .scoremeter .fill{height:100%;background:linear-gradient(90deg,var(--ok),var(--gold),var(--danger));transition:width .4s ease}
  .banner{background:#0e1422;color:var(--muted);font-size:12px;text-align:center;padding:6px;border-bottom:1px solid var(--line)}
</style>
</head>
<body>
<div class="banner">Standalone demo — runs entirely in your browser. No server, no install. Same logic as the full Vault build.</div>
<div id="app"></div>

<script>
"use strict";
/* ---------------- pure-JS SHA-256 (works on file://, no Web Crypto needed) -------------- */
function sha256(ascii){
  function rightRotate(v,a){return (v>>>a)|(v<<(32-a))}
  var mathPow=Math.pow,maxWord=mathPow(2,32),result="";
  var words=[],asciiBitLength=ascii.length*8;
  var hash=sha256.h=sha256.h||[],k=sha256.k=sha256.k||[],primeCounter=k.length;
  var isComposite={};
  for(var candidate=2;primeCounter<64;candidate++){
    if(!isComposite[candidate]){
      for(var i=0;i<313;i+=candidate)isComposite[i]=candidate;
      hash[primeCounter]=(mathPow(candidate,.5)*maxWord)|0;
      k[primeCounter++]=(mathPow(candidate,1/3)*maxWord)|0;
    }
  }
  ascii+="\x80";
  while(ascii.length%64-56)ascii+="\x00";
  for(i=0;i<ascii.length;i++){
    var j=ascii.charCodeAt(i);
    if(j>>8)return; // ascii only (we JSON.stringify, which escapes non-ascii)
    words[i>>2]|=j<<((3-i)%4)*8;
  }
  words[words.length]=(asciiBitLength/maxWord)|0;
  words[words.length]=asciiBitLength;
  for(j=0;j<words.length;){
    var w=words.slice(j,j+=16),oldHash=hash;
    hash=hash.slice(0,8);
    for(i=0;i<64;i++){
      var w15=w[i-15],w2=w[i-2];
      var a=hash[0],e=hash[4];
      var temp1=hash[7]
        +(rightRotate(e,6)^rightRotate(e,11)^rightRotate(e,25))
        +((e&hash[5])^((~e)&hash[6]))
        +k[i]
        +(w[i]=(i<16)?w[i]:(
            w[i-16]
            +(rightRotate(w15,7)^rightRotate(w15,18)^(w15>>>3))
            +w[i-7]
            +(rightRotate(w2,17)^rightRotate(w2,19)^(w2>>>10))
          )|0);
      var temp2=(rightRotate(a,2)^rightRotate(a,13)^rightRotate(a,22))
        +((a&hash[1])^(a&hash[2])^(hash[1]&hash[2]));
      hash=[(temp1+temp2)|0].concat(hash);
      hash[4]=(hash[4]+temp1)|0;
    }
    for(i=0;i<8;i++)hash[i]=(hash[i]+oldHash[i])|0;
  }
  for(i=0;i<8;i++)for(j=3;j+1;j--){
    var b=(hash[i]>>(j*8))&255;
    result+=((b<16)?0:"")+b.toString(16);
  }
  return result;
}

/* ---------------- domain model (mirrors server) ---------------- */
var HOLD_THRESHOLD=70, NEW_PAYEE_AMOUNT=50000;
var profile={name:"Alex Morgan",tier:"Vault Premier",dailyLimitPence:1000000};

function seedAccounts(){return[
  {id:"acc_current",name:"Current Account",sortCode:"04-29-11",accountNumber:"20583491",type:"current",balancePence:1482055},
  {id:"acc_savings",name:"Savings",sortCode:"04-29-11",accountNumber:"44128806",type:"savings",balancePence:4210000},
  {id:"acc_joint",name:"Joint Account",sortCode:"04-29-11",accountNumber:"77451175",type:"joint",balancePence:326510},
];}
function seedPayees(){return[
  {id:"payee_landlord",name:"Jane Foster (Landlord)",sortCode:"20-00-00",accountNumber:"31114520",isNew:false},
  {id:"payee_water",name:"Thames Water",sortCode:"60-80-09",accountNumber:"70114488",isNew:false},
  {id:"payee_gas",name:"British Gas",sortCode:"40-05-30",accountNumber:"55012390",isNew:false},
];}

var SCAM_PATTERNS={
  impersonation_safe_account:{label:"Bank/police impersonation — 'safe account'"},
  investment:{label:"Investment / crypto scam"},
  purchase:{label:"Purchase scam"},
  romance:{label:"Romance scam"},
  invoice_ceo:{label:"Invoice / CEO fraud"},
};
var SIGNAL_LEXICON=[
  {phrase:/safe account/i,pattern:"impersonation_safe_account",weight:45},
  {phrase:/\bbank\b.*(told|asked|said|called)/i,pattern:"impersonation_safe_account",weight:30},
  {phrase:/(fraud team|security team|police|hmrc|tax)/i,pattern:"impersonation_safe_account",weight:25},
  {phrase:/(protect|move).*(money|funds|savings)/i,pattern:"impersonation_safe_account",weight:20},
  {phrase:/(invest|crypto|bitcoin|trading|returns?)/i,pattern:"investment",weight:30},
  {phrase:/(don'?t tell|keep.*(secret|private)|not mention)/i,pattern:"impersonation_safe_account",weight:35},
  {phrase:/(urgent|immediately|right now|act fast|deadline)/i,pattern:"impersonation_safe_account",weight:15},
  {phrase:/(met (him|her|them) online|dating|never met)/i,pattern:"romance",weight:30},
  {phrase:/(marketplace|facebook|ebay|gumtree|listing)/i,pattern:"purchase",weight:15},
  {phrase:/(invoice|supplier|new bank details|changed.*details)/i,pattern:"invoice_ceo",weight:25},
];
var CHOICE_WEIGHTS={
  contacted_yes:{weight:20,pattern:"impersonation_safe_account"},
  who_bank_police:{weight:35,pattern:"impersonation_safe_account"},
  who_investment:{weight:30,pattern:"investment"},
  who_online:{weight:25,pattern:"romance"},
  who_seller:{weight:10,pattern:"purchase"},
  who_boss:{weight:20,pattern:"invoice_ceo"},
  safe_account_yes:{weight:40,pattern:"impersonation_safe_account"},
};
function analyze(input){
  var signals=[],delta=0;
  if(input.choice&&CHOICE_WEIGHTS[input.choice]){
    var c=CHOICE_WEIGHTS[input.choice];
    signals.push({label:SCAM_PATTERNS[c.pattern].label,weight:c.weight});delta+=c.weight;
  }
  if(input.freeText){
    SIGNAL_LEXICON.forEach(function(s){
      if(s.phrase.test(input.freeText)){signals.push({label:SCAM_PATTERNS[s.pattern].label,weight:s.weight});delta+=s.weight;}
    });
  }
  var rationale=signals.length?("Detected "+signals.length+" scam signal(s): "+signals.map(function(s){return s.label}).join("; ")+"."):"No scam signals detected in this answer.";
  return {delta:delta,signals:signals,rationale:rationale};
}
var QUESTION_FLOW=[
  {id:"contacted",text:"Before we move this money — did someone recently contact you and tell you to make this payment, or help you set it up?",type:"choice",options:[{value:"contacted_yes",label:"Yes, someone contacted me"},{value:"contacted_no",label:"No, this was entirely my idea"}]},
  {id:"who",text:"Who did they say they were?",type:"choice",options:[{value:"who_bank_police",label:"My bank, the police, or HMRC"},{value:"who_investment",label:"An investment or crypto company"},{value:"who_online",label:"Someone I met online"},{value:"who_seller",label:"A seller or marketplace"},{value:"who_boss",label:"My employer or a supplier"}]},
  {id:"safe_account",text:"Were you told this is a 'safe account', or that moving the money will protect it?",type:"yesno",options:[{value:"safe_account_yes",label:"Yes"},{value:"safe_account_no",label:"No"}]},
  {id:"detail",text:"In your own words, what did they tell you? (This helps us protect you.)",type:"freetext"},
];

function assessPayment(payment,account,payee){
  var reasons=[],score=0;
  if(payee.isNew){score+=30;reasons.push("First payment to a brand-new payee");}
  if(payment.amountPence>=NEW_PAYEE_AMOUNT){score+=20;reasons.push("Large amount (≥ £500)");}
  if(payment.markedUrgent){score+=20;reasons.push("Customer marked the payment urgent");}
  if(payment.amountPence>account.balancePence*0.5){score+=15;reasons.push("Payment is more than half the account balance");}
  if(/safe|secure|protect|hold/i.test(payee.name)){score+=25;reasons.push("Payee name resembles a 'safe account' lure");}
  return {intervene:score>=40,score:score,reasons:reasons};
}

/* ---------------- hash-chained audit log ---------------- */
var GENESIS="0".repeat(64);
function Audit(){this.chain=[];}
Audit.prototype.record=function(actor,action,details){
  var prevHash=this.chain.length?this.chain[this.chain.length-1].hash:GENESIS;
  var base={seq:this.chain.length+1,timestamp:new Date().toISOString(),actor:actor,action:action,details:details||{},prevHash:prevHash};
  base.hash=sha256(JSON.stringify({seq:base.seq,timestamp:base.timestamp,actor:base.actor,action:base.action,details:base.details,prevHash:base.prevHash}));
  this.chain.push(base);return base;
};
Audit.prototype.verify=function(){
  var prev=GENESIS;
  for(var i=0;i<this.chain.length;i++){var e=this.chain[i];
    var expect=sha256(JSON.stringify({seq:e.seq,timestamp:e.timestamp,actor:e.actor,action:e.action,details:e.details,prevHash:e.prevHash}));
    if(e.prevHash!==prev||e.hash!==expect)return{valid:false,brokenAt:e.seq};prev=e.hash;}
  return{valid:true};
};

/* ---------------- app state ---------------- */
var state={accounts:seedAccounts(),payees:seedPayees(),audit:new Audit(),
  form:{fromAccountId:"acc_current",payeeId:"",amount:"8000",reference:"",markedUrgent:false},
  active:null /* intervention session */};
state.audit.record("system","service.started",{service:"vault-standalone"});

var fmtGBP=function(p){return new Intl.NumberFormat("en-GB",{style:"currency",currency:"GBP"}).format(p/100)};
var mask=function(a){return "••••"+a.slice(-4)};
function acc(id){return state.accounts.filter(function(a){return a.id===id})[0]}
function payee(id){return state.payees.filter(function(p){return p.id===id})[0]}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]})}

/* ---------------- actions ---------------- */
function resetDemo(){state.accounts=seedAccounts();state.payees=seedPayees();state.audit.record("ops-review","demo.reset",{});}
function loadBeat(kind){
  resetDemo();
  var p=kind==="car"
    ?{id:"payee_"+Date.now(),name:"Prestige Motors Ltd",sortCode:"30-16-22",accountNumber:"44102291",isNew:true}
    :{id:"payee_"+Date.now(),name:"Safe Account (Fraud Team)",sortCode:"60-12-99",accountNumber:"78451200",isNew:true};
  state.payees.push(p);state.audit.record("customer","payee.added",{payeeId:p.id,name:p.name});
  state.form={fromAccountId:"acc_current",payeeId:p.id,amount:"8000",reference:kind==="car"?"Used car — balance":"Account protection",markedUrgent:kind!=="car"};
  render();
}
function startPayment(){
  var f=state.form,account=acc(f.fromAccountId),pe=payee(f.payeeId);
  if(!account||!pe)return;
  var amountPence=Math.round(parseFloat(f.amount||"0")*100);
  if(!(amountPence>0))return;
  var payment={id:"pay_"+Date.now(),fromAccountId:f.fromAccountId,payeeId:f.payeeId,amountPence:amountPence,reference:f.reference,markedUrgent:f.markedUrgent,status:"cleared"};
  state.audit.record("customer","payment.initiated",{paymentId:payment.id,payeeId:pe.id,amountPence:amountPence,markedUrgent:payment.markedUrgent});
  var trig=assessPayment(payment,account,pe);
  state.audit.record("rules-engine","payment.assessed",{paymentId:payment.id,triggerScore:trig.score,intervene:trig.intervene,reasons:trig.reasons});
  if(trig.intervene){
    state.audit.record("ai-analyst","intervention.opened",{paymentId:payment.id});
    state.active={payment:payment,trigger:trig,step:0,scamScore:0,question:QUESTION_FLOW[0],decision:null,freeText:""};
  }else{
    account.balancePence-=amountPence;state.audit.record("rules-engine","payment.cleared",{paymentId:payment.id});
  }
  render();
}
function answer(input){
  var s=state.active;if(!s||s.decision)return;
  var current=QUESTION_FLOW[s.step];
  var a=analyze(input);s.scamScore+=a.delta;
  state.audit.record("ai-analyst","intervention.answer_analysed",{question:current.id,answer:input,delta:a.delta,runningScore:s.scamScore,signals:a.signals,rationale:a.rationale});
  if(current.id==="contacted"&&input.choice==="contacted_no"){return finish();}
  s.step+=1;
  if(s.step>=QUESTION_FLOW.length){return finish();}
  s.question=QUESTION_FLOW[s.step];s.freeText="";render();
}
function finish(){
  var s=state.active;
  var outcome=s.scamScore>=HOLD_THRESHOLD?"hold":"release";
  var rationale=outcome==="hold"
    ?("Cumulative scam score "+s.scamScore+" ≥ "+HOLD_THRESHOLD+". Payment held and escalated to human review — deliberately NOT auto-declined.")
    :("Cumulative scam score "+s.scamScore+" < "+HOLD_THRESHOLD+". No strong scam pattern; payment released.");
  state.audit.record("ai-analyst","intervention.decision."+outcome,{paymentId:s.payment.id,scamScore:s.scamScore,rationale:rationale});
  s.question=null;s.decision={outcome:outcome,rationale:rationale};
  if(outcome==="hold"){s.payment.status="held";}
  else{s.payment.status="cleared";acc(s.payment.fromAccountId).balancePence-=s.payment.amountPence;}
  render();
}
function resolve(action){
  var s=state.active;
  if(action==="release"){s.payment.status="released";acc(s.payment.fromAccountId).balancePence-=s.payment.amountPence;state.audit.record("customer","payment.released_after_hold",{paymentId:s.payment.id});}
  else{s.payment.status="cancelled";state.audit.record("customer","payment.cancelled_after_warning",{paymentId:s.payment.id});}
  state.active=null;render();
}

/* ---------------- render ---------------- */
var ACTOR_ICON={customer:"👤","rules-engine":"⚙️","ai-analyst":"🧠","ops-review":"🏢",system:"🔧"};
function render(){
  var f=state.form;
  var html='<div class="topbar">'
    +'<div class="brand"><span class="logo">🛡️ VAULT</span><span class="tagline">security is the product — not the fine print</span></div>'
    +'<div class="who"><span class="cust">'+profile.name+'</span><span class="tier">'+profile.tier+' · '+fmtGBP(profile.dailyLimitPence)+'/day limit</span></div>'
    +'<div class="scenarios"><button class="ghostbtn" onclick="loadBeat(\'car\')">▶ Beat 2: car (clears)</button>'
    +'<button class="reset" onclick="loadBeat(\'scam\')">▶ Beat 3: scam (holds)</button></div></div>';

  html+='<div class="grid"><section class="panel"><h2>Accounts</h2><div class="accounts">';
  state.accounts.forEach(function(a){
    html+='<div class="account '+a.type+'"><div class="acc-name">'+esc(a.name)+'</div><div class="acc-meta">'+a.sortCode+' · '+mask(a.accountNumber)+'</div><div class="acc-balance">'+fmtGBP(a.balancePence)+'</div></div>';
  });
  html+='</div><h2>Make a payment</h2><div class="form">';
  html+='<label>From<select onchange="state.form.fromAccountId=this.value">'+state.accounts.map(function(a){return '<option value="'+a.id+'"'+(a.id===f.fromAccountId?' selected':'')+'>'+esc(a.name)+' — '+fmtGBP(a.balancePence)+'</option>'}).join("")+'</select></label>';
  html+='<label>To payee<select onchange="state.form.payeeId=this.value"><option value="">Select a payee…</option>'+state.payees.map(function(p){return '<option value="'+p.id+'"'+(p.id===f.payeeId?' selected':'')+'>'+esc(p.name)+' '+(p.isNew?'(new)':'✓ trusted')+'</option>'}).join("")+'</select></label>';
  html+='<label>Amount (£)<input value="'+esc(f.amount)+'" oninput="state.form.amount=this.value"></label>';
  html+='<label>Reference<input value="'+esc(f.reference)+'" oninput="state.form.reference=this.value"></label>';
  html+='<label class="check"><input type="checkbox" '+(f.markedUrgent?'checked':'')+' onchange="state.form.markedUrgent=this.checked"> Mark as urgent</label>';
  html+='<button class="primary" '+(f.payeeId?'':'disabled')+' onclick="startPayment()">Send '+(f.amount?fmtGBP(Math.round(parseFloat(f.amount||"0")*100)):"")+'</button>';
  html+='</div></section>';

  // audit
  var integ=state.audit.verify();
  html+='<aside class="audit"><div class="audit-head"><h3>Immutable audit trail</h3><span class="integrity '+(integ.valid?"ok":"bad")+'">'+(integ.valid?"🔒 chain verified":"⚠️ chain broken")+'</span></div><ol>';
  state.audit.chain.slice().reverse().forEach(function(e){
    html+='<li><div class="row"><span class="actor">'+(ACTOR_ICON[e.actor]||"•")+' '+e.actor+'</span><span class="action">'+e.action+'</span></div><code class="hash" title="'+e.hash+'">#'+e.seq+' · '+e.hash.slice(0,12)+'…</code></li>';
  });
  html+='</ol></aside></div>';

  // intervention overlay
  var s=state.active;
  if(s){
    var held=s.decision&&s.decision.outcome==="hold";
    html+='<div class="overlay"><div class="intervention'+(held?' held':'')+'">';
    html+='<header><span class="shield">🛡️</span><div><h2>Hold on — let\'s check this together</h2><p class="sub">Vault paused your '+fmtGBP(s.payment.amountPence)+' payment for a moment. This takes 20 seconds and could save your money.</p></div></header>';
    html+='<details class="why"><summary>Why we paused this ('+s.trigger.score+' pts)</summary><ul>'+s.trigger.reasons.map(function(r){return '<li>'+esc(r)+'</li>'}).join("")+'</ul></details>';
    if(s.question){
      html+='<p class="qtext">'+esc(s.question.text)+'</p>';
      if(s.question.type!=="freetext"){
        html+='<div class="options">'+s.question.options.map(function(o){return '<button onclick="answer({choice:\''+o.value+'\'})">'+esc(o.label)+'</button>'}).join("")+'</div>';
      }else{
        html+='<div class="freetext"><textarea id="ft" rows="3" placeholder="e.g. The bank\'s fraud team called and said my account isn\'t safe…" oninput="state.active.freeText=this.value">'+esc(s.freeText)+'</textarea><button onclick="answer({freeText:state.active.freeText})">Continue</button></div>';
      }
    }
    if(s.decision){
      if(held){
        html+='<div class="decision hold"><h3>🚫 We\'ve held this payment</h3><p>Your answers match a known scam pattern. <strong>No money has left your account.</strong> A real bank fraud team would never ask you to move money to a "safe account." We\'ve flagged this for human review.</p><p class="rationale">'+esc(s.decision.rationale)+'</p><div class="actions"><button class="danger" onclick="resolve(\'cancel\')">Cancel this payment — it was a scam</button><button class="ghost" onclick="resolve(\'release\')">I\'m certain it\'s safe — release it</button></div><p class="agency">You stay in control. We hold and explain; we never block outright.</p></div>';
      }else{
        html+='<div class="decision"><h3>✅ All clear</h3><p>Thanks — nothing about this looks like a scam. Your payment is on its way.</p><p class="rationale">'+esc(s.decision.rationale)+'</p><button class="primary" onclick="state.active=null;render()">Done</button></div>';
      }
    }
    html+='<footer class="scoremeter"><div class="bar"><div class="fill" style="width:'+Math.min(s.scamScore,100)+'%"></div></div><span>scam-likelihood '+s.scamScore+'/100</span></footer>';
    html+='</div></div>';
  }

  document.getElementById("app").innerHTML=html;
}
render();
</script>
</body>
</html>
